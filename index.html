<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2048%2048%22%20width=%22256%22%20height=%22256%22%3E%3Crect%20width=%2248%22%20height=%2248%22%20rx=%2212%22%20fill=%22%233a4bd8%22/%3E%3Cpath%20d=%22M14%209h14l8%208v22a2%202%200%200%201-2%202H14a2%202%200%200%201-2-2V11a2%202%200%200%201%202-2z%22%20fill=%22%23fff%22/%3E%3Cpath%20d=%22M28%209l8%208h-6a2%202%200%200%201-2-2z%22%20fill=%22%233a4bd8%22%20fill-opacity=%22.3%22/%3E%3Crect%20x=%2217%22%20y=%2221%22%20width=%2212%22%20height=%222.6%22%20rx=%221.3%22%20fill=%22%233a4bd8%22%20fill-opacity=%22.45%22/%3E%3Crect%20x=%2215.5%22%20y=%2226%22%20width=%2219%22%20height=%226.4%22%20rx=%222.2%22%20fill=%22%233a4bd8%22%20fill-opacity=%22.22%22/%3E%3Crect%20x=%2217.5%22%20y=%2227.9%22%20width=%2214%22%20height=%222.6%22%20rx=%221.3%22%20fill=%22%233a4bd8%22/%3E%3Crect%20x=%2217%22%20y=%2235.5%22%20width=%229%22%20height=%222.6%22%20rx=%221.3%22%20fill=%22%233a4bd8%22%20fill-opacity=%22.45%22/%3E%3C/svg%3E">
<title>Noman's PDF Reader</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3a4bd8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Noman's PDF Reader">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{--dw:320px;--desk:#e6e8ef;--panel:#f8f9fc;--glass:rgba(255,255,255,.8);--ink:#161a28;--mute:#6a7088;--line:#dcdfe9;--acc:#3a4bd8;--on:#fff;--hover:#eceef6;--sh:0 10px 34px rgba(20,25,60,.18);--ui:"Figtree","Segoe UI",system-ui,sans-serif;--serif:"Newsreader",Georgia,serif}
:root[data-theme=dark]{--desk:#11131b;--panel:#1a1d29;--glass:rgba(26,29,41,.82);--ink:#eceef7;--mute:#8e94ab;--line:#2b3042;--acc:#8f9bff;--on:#10122a;--hover:#252a3b;--sh:0 10px 34px rgba(0,0,0,.5)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font:14px/1.5 var(--ui);background:var(--desk);color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
svg{display:block}
#app{display:grid;grid-template-columns:0 1fr;grid-template-rows:minmax(0,1fr);height:100%;transition:grid-template-columns .28s cubic-bezier(.2,.8,.2,1)}
#app.open{grid-template-columns:var(--dw) 1fr}
/* drawer */
#drawer{overflow:hidden;background:var(--panel);border-right:1px solid var(--line)}
#dIn{width:var(--dw);height:100%;display:flex;flex-direction:column}
#brand{padding:20px 22px 12px;font:500 24px var(--serif);letter-spacing:-.01em;display:flex;align-items:center;gap:11px}#brand svg{flex:none;border-radius:9px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
#empty .elogo{margin:0 auto 16px;border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#tabs{display:flex;margin:4px 18px 10px;background:var(--hover);border-radius:10px;padding:3px}
#tabs button{flex:1;border:0;background:none;padding:6px;border-radius:8px;color:var(--mute);font-weight:500}
#tabs button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.pane{flex:1;overflow:auto;padding:4px 10px 24px;display:none}.pane.on{display:block}
.hint{color:var(--mute);padding:10px 12px}
.pane ul{list-style:none;margin:0;padding:0}
.trow{display:flex;align-items:flex-start;border-radius:8px}.trow:hover{background:var(--hover)}
.tg{border:0;background:none;width:22px;height:30px;color:var(--mute);flex:none;transition:transform .15s}
.tg.o{transform:rotate(90deg)}
.tl{border:0;background:none;text-align:left;flex:1;padding:5px 8px 5px 0;line-height:1.35}
.nitem{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:10px;border-left:3px solid var(--c);margin:0 0 6px;background:var(--hover)}
.nitem small{color:var(--mute);display:block}
.nitem em{font:italic 15px var(--serif);display:block;margin:2px 0}
/* centre */
#center{position:relative;min-width:0;display:grid;grid-template-rows:auto auto minmax(0,1fr)}
#viewer{position:relative;overflow:auto;min-height:0}
#stage{position:relative;padding:28px 28px 60px;min-height:100%}
#bar{position:relative;z-index:20;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:14px;padding:9px 18px;background:var(--panel);border-bottom:1px solid var(--line)}
.grp{display:flex;align-items:center;gap:4px;min-width:0}.grp.r{justify-content:flex-end}
#bar button{border:0;background:none;border-radius:10px;height:34px;min-width:34px;padding:0 9px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--ink)}
#bar button:hover{background:var(--hover)}
#bar .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
#bar input{width:44px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;height:30px;text-align:center;font:inherit;-moz-appearance:textfield}
#bar input::-webkit-inner-spin-button{display:none}
#total,#zl{color:var(--mute);font-size:13px;padding:0 4px}
#title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 8px;font-weight:600}
#bar button.go{background:var(--acc);color:var(--on);font-weight:600;padding:0 16px}
#bar button.go:hover{filter:brightness(1.1)}
#bar button.go.dirty:after{content:"";width:7px;height:7px;border-radius:50%;background:#ffb547}
@media(max-width:1300px){#who span{display:none}}
#bar button.go{white-space:nowrap}
#empty{margin:16vh auto 0;max-width:430px;text-align:center;padding:42px 34px;background:var(--panel);border:1.5px dashed var(--line);border-radius:22px}
#empty h2{font:500 30px/1.15 var(--serif);margin:0 0 10px}
#empty p{color:var(--mute);margin:0 0 22px}
#empty button{background:var(--acc);color:var(--on);border:0;border-radius:12px;padding:11px 22px;font-weight:600}
.page{position:relative;margin:0 auto 22px;background:#fff;border-radius:3px;box-shadow:0 1px 3px rgba(0,0,0,.18),0 12px 40px rgba(10,15,40,.2)}
.page canvas{display:block;border-radius:3px}
.hl{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply}
.hl i{position:absolute;border-radius:3px}
.textLayer{position:absolute;inset:0;overflow:hidden;line-height:1;color:transparent}
.textLayer span,.textLayer br{position:absolute;white-space:pre;cursor:text;transform-origin:0 0}
.textLayer ::selection{background:rgba(58,75,216,.28)}
/* selection toolbar */
#sel{position:fixed;display:none;z-index:40;align-items:center;gap:6px;padding:7px 10px;background:#161a28;color:#fff;border-radius:12px;box-shadow:var(--sh)}
#sel span{font-size:12px;opacity:.7;margin-right:2px}
#sel button{width:22px;height:22px;border-radius:50%;border:2px solid #161a28;box-shadow:0 0 0 1px rgba(255,255,255,.35);padding:0}
#sel button:hover{transform:scale(1.18)}
/* note popup */
#note{position:absolute;display:none;z-index:30;width:340px;min-width:260px;min-height:190px;max-width:92vw;max-height:85vh;overflow:hidden;flex-direction:column;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:14px;box-shadow:var(--sh);padding:12px 14px 14px;animation:pop .16s ease-out}
#peek{position:fixed;left:calc(var(--dw) + 6px);display:none;z-index:35;background:var(--desk);border:1px solid var(--line);border-radius:10px;box-shadow:var(--sh);overflow:auto}
.pp{position:relative;margin:10px auto;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18)}.pp canvas{display:block}
#btabs{display:none;align-items:flex-end;gap:4px;padding:6px 14px 0;background:var(--desk);border-bottom:1px solid var(--line);overflow-x:auto}
.bt{display:flex;align-items:center;gap:7px;max-width:240px;padding:7px 8px 7px 12px;border-radius:10px 10px 0 0;background:var(--hover);color:var(--mute);cursor:pointer;border:1px solid var(--line);border-bottom:0;font-weight:500;white-space:nowrap}
.bt.on{background:var(--panel);color:var(--ink);position:relative;top:1px}
.bt .nm{overflow:hidden;text-overflow:ellipsis}.bt .dd{width:7px;height:7px;border-radius:50%;background:#ffb547;flex:none}
.bt button,#btabs .add{border:0;background:none;border-radius:6px;width:24px;height:24px;padding:0;display:flex;align-items:center;justify-content:center;color:inherit;flex:none}
.bt button:hover,#btabs .add:hover{background:var(--line)}.bt svg,#btabs .add svg{width:13px;height:13px}
.bth{margin-left:auto;color:var(--mute);font-size:12px;padding:0 6px 8px;white-space:nowrap}
#dlg{position:fixed;inset:0;z-index:100;background:rgba(10,14,30,.5);display:flex;align-items:center;justify-content:center}
#dlg .box{width:min(520px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:22px}
#dlg h3{margin:0 0 4px;font:500 24px var(--serif)}#dlg p{margin:0 0 14px;color:var(--mute)}
.drow{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}.drow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.seg{display:flex;background:var(--hover);border-radius:9px;padding:3px}.seg button{border:0;background:none;padding:5px 12px;border-radius:7px;color:var(--mute);font-weight:500}.seg button.on{background:var(--acc);color:var(--on)}
.dfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}.dfoot button{border:1px solid var(--line);background:var(--hover);border-radius:10px;padding:8px 14px;font-weight:600}.dfoot button.pri{background:var(--acc);color:var(--on);border-color:transparent}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}
.nh{display:flex;align-items:center;gap:4px;margin-bottom:6px}
.nh b{font-weight:600}.nh .sp{flex:1}
.nh button{border:0;background:none;border-radius:8px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;color:var(--mute)}
.nh button:hover{background:var(--hover);color:var(--ink)}
.nq{font:italic 14px/1.4 var(--serif);color:var(--mute);border-left:2px solid var(--c);padding-left:10px;margin-bottom:10px}
.ntb{display:flex;gap:2px;margin-bottom:6px;align-items:center}
.ntb button{border:0;background:none;border-radius:7px;min-width:28px;height:28px;color:var(--ink)}
.ntb button:hover{background:var(--hover)}
.ntb i{width:14px;height:14px;border-radius:50%;display:block}
.ed,.nv{font:17px/1.55 var(--serif);min-height:64px;flex:1 1 auto;overflow:auto;word-break:break-word;overflow-wrap:anywhere;text-align:left}
#note>.nh,#note>.by,#note>.nq,#note>.ntb,#note>.nf{flex:none}
#note .nf{padding-right:10px}
.ed{outline:0;border:1.5px solid var(--acc);border-radius:10px;padding:9px 11px;background:var(--desk)}
.ed:empty:before{content:"Write your note…";color:var(--mute)}
.nv.blank{color:var(--mute);font-style:italic}
.ed ul,.ed ol,.nv ul,.nv ol{margin:4px 0;padding-left:22px}.ed h3,.nv h3{margin:4px 0;font-size:18px}
.nf{display:flex;justify-content:flex-end;margin-top:12px}
.nf button{background:var(--acc);color:var(--on);border:0;border-radius:10px;padding:8px 16px;font-weight:600}
#who span{max-width:15ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
#whoBox{position:absolute;z-index:25;top:64px;left:50%;transform:translateX(-50%);display:none;width:290px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);padding:14px}
#whoBox label{display:block;font-weight:600;margin-bottom:2px}
#whoBox p{margin:0 0 10px;color:var(--mute);font-size:13px}
#whoBox input{width:100%;height:38px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;background:var(--desk);color:var(--ink);font:inherit;margin-bottom:10px}
#whoBox input:focus{outline:0;border-color:var(--acc)}
#whoBox button{background:var(--acc);color:var(--on);border:0;border-radius:10px;padding:8px 16px;font-weight:600;float:right}
.by{color:var(--mute);font-size:12.5px;margin:-2px 0 8px}.by:empty{display:none}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#161a28;color:#fff;padding:10px 18px;border-radius:12px;display:none;z-index:50;box-shadow:var(--sh)}

/* ---- adaptive layout: phone / tablet / laptop / tv ---- */
#scrim{display:none}
#viewer:focus{outline:0}
.rz{position:absolute;right:3px;bottom:3px;width:22px;height:22px;cursor:nwse-resize;touch-action:none;opacity:.55;background:linear-gradient(135deg,transparent 52%,var(--mute) 52% 60%,transparent 60% 72%,var(--mute) 72% 80%,transparent 80%)}
#bar{padding-left:max(18px,env(safe-area-inset-left));padding-right:max(18px,env(safe-area-inset-right))}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#viewer:focus,#viewer:focus-visible{outline:0}
@supports(height:100dvh){html,body,#app{height:100dvh}}
@media(max-width:900px){
 #app,#app.open{grid-template-columns:1fr}
 #drawer{position:fixed;z-index:60;top:0;bottom:0;left:0;width:min(88vw,360px);transform:translateX(-104%);transition:transform .26s cubic-bezier(.2,.8,.2,1);box-shadow:var(--sh)}
 #app.open #drawer{transform:none}
 #dIn{width:100%}
 #scrim{position:fixed;inset:0;z-index:55;background:rgba(10,14,30,.45);display:none}
 #app.open #scrim{display:block}
 #stage{padding:14px 8px 60px}
}
@media(max-width:700px){
 #bar{display:flex;gap:4px;padding:6px 8px;overflow-x:auto;scrollbar-width:none}
 #bar .grp{flex:none}#bar .grp.r{margin-left:auto}
 #title,#zl,#boost,#pgmode,#bar .sep,#zin,#zout,#prev,#next,#closebk{display:none!important}
 #bar button.go{padding:0 12px}
 #btabs{padding:4px 8px 0}.bth{display:none}
 #empty{margin-top:8vh;padding:30px 22px}
 #note{position:fixed!important;left:8px!important;right:8px!important;top:auto!important;bottom:calc(8px + env(safe-area-inset-bottom))!important;width:auto!important;height:auto!important;max-height:62vh;min-width:0}
 .rz{display:none}
 #whoBox{width:min(290px,92vw)}
}
@media(pointer:coarse){
 button{touch-action:manipulation}
 #bar button{min-width:42px;height:42px}
 #bar input{height:38px;width:54px;font-size:16px}
 .tg{width:38px;height:42px}.tl{padding:11px 8px 11px 0}
 #tabs button{padding:10px}.nitem{padding:13px 14px}
 #sel{padding:10px 14px;gap:14px}#sel button{width:34px;height:34px}
 .nh button,.ntb button{min-width:40px;height:40px}
 .bt{padding:10px 8px 10px 14px}.bt button,#btabs .add{width:32px;height:32px}
 .seg button{padding:9px 14px}.dfoot button{padding:12px 16px}
 #whoBox input{font-size:16px}.ed{font-size:18px}
 .rz{width:30px;height:30px}
}
html[data-dev=tv],html[data-dev=tv] body{font-size:20px}
html[data-dev=tv]{--dw:430px}
html[data-dev=tv] #bar{padding:12px 32px;gap:22px}
html[data-dev=tv] #bar button{height:54px;min-width:54px;font-size:19px;border-radius:12px}
html[data-dev=tv] #bar input{height:46px;width:70px;font-size:19px}
html[data-dev=tv] svg{width:26px;height:26px}
html[data-dev=tv] #logo{width:44px;height:44px}html[data-dev=tv] .elogo{width:80px;height:80px}
html[data-dev=tv] #brand{font-size:32px}
html[data-dev=tv] .tl{padding:9px 8px 9px 0}html[data-dev=tv] .tg{height:42px;width:34px}
html[data-dev=tv] .ed,html[data-dev=tv] .nv{font-size:24px}
html[data-dev=tv] #note{width:520px;min-height:260px}
html[data-dev=tv] .bt{font-size:18px;padding:11px 10px 11px 16px}
html[data-dev=tv] #stage{padding:40px 40px 80px}
html[data-dev=tv] #empty h2{font-size:42px}

/* dark mode: the PDF page itself goes dark too (toggle with the ◐ button) */
html[data-theme=dark]:not([data-pg=light]) .page,html[data-theme=dark]:not([data-pg=light]) .pp{background:#1a1a1a}
html[data-theme=dark]:not([data-pg=light]) .page canvas,html[data-theme=dark]:not([data-pg=light]) .pp canvas{filter:invert(.9) hue-rotate(180deg)}
html[data-theme=dark]:not([data-pg=light]) .hl{mix-blend-mode:normal;opacity:.42}
html[data-theme=dark] .textLayer ::selection{background:rgba(143,155,255,.45)}
/* ---- per-PDF note colours ---- */
#sel{flex-wrap:wrap;max-width:min(94vw,470px)}
#sel button.ch{width:auto;height:30px;border-radius:15px;padding:0 11px 0 7px;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border:0;box-shadow:none;color:#fff;font-size:12.5px;font-weight:600}
#sel button.ch:hover{background:rgba(255,255,255,.22);transform:none}
#sel button.ch i{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.4)}
#sel button.cfg{width:30px;height:30px;background:none;border:0;box-shadow:none;color:#fff;opacity:.8;display:flex;align-items:center;justify-content:center}
.plb{margin-left:8px;padding:1px 10px;border-radius:999px;background:var(--c);font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}.plb:empty{display:none}
.pcol{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 9px}#note>.pcol{flex:none}
.pd{width:20px;height:20px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px rgba(0,0,0,.22);padding:0}
.pd.on{box-shadow:0 0 0 2px var(--ink)}
.nlt{display:flex;flex-wrap:wrap;gap:6px;padding:2px 4px 12px}
.fchip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 11px 3px 9px;font-size:12.5px;font-weight:500}
.fchip i{width:10px;height:10px;border-radius:50%;flex:none}.fchip svg{width:14px;height:14px}
.fchip.on{background:var(--acc);color:var(--on);border-color:transparent}
.fchip.edit{margin-left:auto;color:var(--acc);border-style:dashed}
.nitem em{margin-top:3px}
.crow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.crow input[type=color]{width:44px;height:38px;border:1px solid var(--line);border-radius:9px;padding:2px;background:var(--panel);cursor:pointer;flex:none}
.crow .clab{flex:1;min-width:0;height:38px;border:1.5px solid var(--line);border-radius:9px;padding:0 11px;background:var(--desk);color:var(--ink);font:inherit}
.crow .clab:focus{outline:0;border-color:var(--acc)}
.cdel{border:0;background:none;color:var(--mute);width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none}
.cdel:hover{background:var(--hover);color:#d33b3b}
#dlg .cl{max-height:52vh;overflow:auto}
@media(pointer:coarse){.pd{width:30px;height:30px}#sel button.ch{height:38px;border-radius:19px;font-size:14px}#sel button.cfg{width:38px;height:38px}}
/* default note popup size on laptop / desktop only (phone, tablet and TV keep their own sizing); dragging the corner still overrides it */
html[data-dev=laptop] #note{width:min(1030px,calc(100vw - var(--dw) - 64px));height:min(620px,80vh)}
</style>
</head>
<body>
<div id="app" class="open">
  <div id="scrim"></div>
  <aside id="drawer"><div id="dIn">
    <div id="brand"><svg id="logo" viewBox="0 0 48 48" width="34" height="34"><rect width="48" height="48" rx="12" fill="#3a4bd8"/><path d="M14 9h14l8 8v22a2 2 0 0 1-2 2H14a2 2 0 0 1-2-2V11a2 2 0 0 1 2-2z" fill="#fff"/><path d="M28 9l8 8h-6a2 2 0 0 1-2-2z" fill="#3a4bd8" fill-opacity=".3"/><rect x="17" y="21" width="12" height="2.6" rx="1.3" fill="#3a4bd8" fill-opacity=".45"/><rect x="15.5" y="26" width="19" height="6.4" rx="2.2" fill="#3a4bd8" fill-opacity=".22"/><rect x="17.5" y="27.9" width="14" height="2.6" rx="1.3" fill="#3a4bd8"/><rect x="17" y="35.5" width="9" height="2.6" rx="1.3" fill="#3a4bd8" fill-opacity=".45"/></svg><span>Noman's PDF Reader</span></div>
    <div id="tabs"><button class="on" data-t="toc">Contents</button><button data-t="nl">Notes</button></div>

<script>
const $=s=>document.querySelector(s);

IC.gear='<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>';
const svg=k=>`<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>`;
document.querySelectorAll("[data-ic]").forEach(b=>b.innerHTML=svg(b.dataset.ic));

let pdf=null,bytes=null,handle=null,fname="",scale=1.3,notes=[],cur=1,io=null,dirty=false,pending=null,act=null;

(async()=>{try{const t=await (await fetch(WORKER)).text();pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([t],{type:"text/javascript"}))}catch(e){pdfjsLib.GlobalWorkerOptions.workerSrc=WORKER}})();

addEventListener("beforeunload",e=>{stash();if(books.some(b=>b.dirty)){e.preventDefault();e.returnValue="";setTimeout(()=>{const l=books.filter(b=>b.dirty);if(l.length&&!$("#dlg"))askSave(l).then(ok=>ok&&toast("Done. You can close the tab now."))},400)}});

const inkOn=h=>{const v=parseInt(String(h).slice(1),16),r=v>>16,g=v>>8&255,b=v&255;return (r*299+g*587+b*114)/1000>150?"#1a1a1a":"#fff"};

/* theme + drawer */
try{document.documentElement.dataset.theme=localStorage.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light")}catch(e){}

/* dark pages on/off (only matters in dark mode) */
let pgDark=true;try{pgDark=localStorage.pgdark!=="0"}catch(e){}
const setPg=()=>{document.documentElement.dataset.pg=pgDark?"dark":"light";$("#pgmode").title="Dark pages in dark mode: "+(pgDark?"on":"off")+" (click to change)"};setPg();
$("#pgmode").onclick=()=>{pgDark=!pgDark;try{localStorage.pgdark=pgDark?"1":"0"}catch(e){}setPg();toast("Dark pages in dark mode: "+(pgDark?"on":"off"))};

/* text darkness: gamma curve on the rendered page makes anti-aliased text heavier and blacker */
const LV=["Normal","Bold","Extra bold"],GAMMA=[1,1.45,1.9];
let boost=1;try{boost=+(localStorage.boost??1)}catch(e){}
function darken(c){
  const g=GAMMA[boost];if(!g||g===1)return;
  const x=c.getContext("2d"),im=x.getImageData(0,0,c.width,c.height),d=im.data,lut=new Uint8ClampedArray(256);
  for(let i=0;i<256;i++)lut[i]=255*Math.pow(i/255,g);
  for(let i=0;i<d.length;i+=4){d[i]=lut[d[i]];d[i+1]=lut[d[i+1]];d[i+2]=lut[d[i+2]]}
  x.putImageData(im,0,0);
}
function rerender(){gen++;document.querySelectorAll(".page").forEach(p=>{p.innerHTML="";delete p.dataset.done;io.unobserve(p);io.observe(p)})}
const boostTip=()=>$("#boost").title="Text darkness: "+LV[boost]+" (click to change)";boostTip();
$("#boost").onclick=()=>{boost=(boost+1)%3;try{localStorage.boost=boost}catch(e){}boostTip();toast("Text darkness: "+LV[boost]);if(pdf)rerender()};
addEventListener("resize",()=>{if(pdf&&devicePixelRatio!==dpr){dpr=devicePixelRatio;document.querySelectorAll(".page").forEach(fit);rerender()}});

/* student name */
let student="";try{student=localStorage.student||""}catch(e){}
const shortDate=t=>t?new Date(t).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}):"";
const stamp=t=>t?shortDate(t)+", "+new Date(t).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}):"";
function showWho(){const w=$("#who");w.innerHTML=svg("user")+"<span></span>";w.querySelector("span").textContent=student||"Add your name"}
showWho();
$("#who").onclick=()=>{const b=$("#whoBox"),show=b.style.display!=="block";b.style.display=show?"block":"none";if(show){$("#whoIn").value=student;$("#whoIn").focus()}};
function saveWho(){student=$("#whoIn").value.trim();try{localStorage.student=student}catch(e){}showWho();$("#whoBox").style.display="none";toast(student?`New notes will be labelled "${student}"`:"Name cleared")}
$("#whoSave").onclick=saveWho;$("#whoIn").onkeydown=e=>{if(e.key==="Enter")saveWho()};
document.addEventListener("mousedown",e=>{if(!e.target.closest("#whoBox,#who"))$("#whoBox").style.display="none"});
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("#tabs button,.pane").forEach(x=>x.classList.remove("on"));b.classList.add("on");$("#"+b.dataset.t).classList.add("on")});

/* open */
/* remember the last folder across browser restarts: the picker's own memory (id) plus the last file handle kept in IndexedDB */
const kvOpen=()=>new Promise((res,rej)=>{const r=indexedDB.open("nomans-reader",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const kvGet=async k=>{try{const d=await kvOpen();return await new Promise(res=>{const q=d.transaction("kv").objectStore("kv").get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)})}catch(e){return null}};
const kvSet=async(k,v)=>{try{const d=await kvOpen();await new Promise(res=>{const t=d.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=res;t.onerror=res;t.onabort=res})}catch(e){}};
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
async function pick(){
  if(!window.showOpenFilePicker)return $("#file").click();
  const base={multiple:true,id:"noman-pdf-reader",types:[{description:"PDF",accept:{"application/pdf":[".pdf"]}}]},last=await kvGet("lastHandle");let hs;
  try{hs=await showOpenFilePicker(last?{...base,startIn:last}:base)}
  catch(e){if(e.name==="AbortError")return;
    try{hs=await showOpenFilePicker(base)}catch(e2){if(e2.name!=="AbortError")$("#file").click();return}}
  kvSet("lastHandle",hs[0]);
  for(const h of hs)await load(await h.getFile(),h);
}
$("#open").onclick=$("#open2").onclick=pick;
$("#file").onchange=async e=>{const fs=[...e.target.files];e.target.value="";for(const f of fs)await load(f)};
addEventListener("dragover",e=>e.preventDefault());
addEventListener("drop",e=>{e.preventDefault();(async()=>{for(const f of e.dataTransfer.files)if(/pdf$/i.test(f.type||f.name))await load(f)})()});

async function readNotes(b){
  try{const doc=await PDFLib.PDFDocument.load(b,{ignoreEncryption:true,updateMetadata:false});
    const s=doc.catalog.lookup(PDFLib.PDFName.of("MarginNotes"));
    if(s&&s.asString){const j=JSON.parse(decodeURIComponent(escape(atob(s.asString()))));return Array.isArray(j)?{notes:j,palette:null}:{notes:j.notes||[],palette:j.palette||null}}
  }catch(e){console.warn("No embedded notes",e)}
  return {notes:[],palette:null};
}
/* books (application tabs) */
let books=[],active=null,mru=[],bid=0;
const snapOf=(n,p)=>JSON.stringify({n:n.map(({editing,...x})=>x),p});
const touch=b=>{mru=[b,...mru.filter(x=>x!==b)]};
function stash(){if(!active)return;Object.assign(active,{pdf,bytes,handle,fname,scale,notes,cur,dirty});if(active.ready!==false)active.scroll=$("#viewer").scrollTop}
function renderTabs(){
  const bar=$("#btabs");bar.style.display=books.length?"flex":"none";bar.innerHTML="";
  books.forEach(b=>{
    const t=mk("div","bt"+(b===active?" on":""));t.title=b.fname;
    const nm=mk("span","nm");nm.textContent=b.fname.replace(/\.pdf$/i,"");
    const x=mk("button","",svg("x"));x.title="Close this book";x.onclick=e=>{e.stopPropagation();closeBook(b)};
    t.append(...(b.dirty?[mk("i","dd")]:[]),nm,x);t.onclick=()=>activate(b);bar.append(t);
  });
  const a=mk("button","add",svg("plus"));a.title="Open another PDF";a.onclick=pick;bar.append(a);
  if(books.length>1)bar.append(mk("span","bth","Hold N + Tab to switch"));
}
async function activate(b,keepMru){
  if(b===active)return;
  stash();closeNote();hidePeek();$("#sel").style.display="none";
  active=b;b.ready=false;if(!keepMru)touch(b);nFilter=null;renderSel();
  ({pdf,bytes,handle,fname,scale,notes,cur,dirty}=b);
  gen++;if(io)io.disconnect();dims={};seen={};
  $("#title").textContent=fname.replace(/\.pdf$/i,"");$("#total").textContent="/ "+pdf.numPages;$("#pg").max=pdf.numPages;$("#pg").value=cur;
  $("#empty").style.display="none";$("#closebk").style.display="";
  $("#savepdf").classList.toggle("dirty",dirty);renderTabs();
  await build();if(active!==b)return;refreshList();loadToc();$("#viewer").scrollTop=b.scroll||0;b.ready=true;if(!coarse())$("#viewer").focus({preventScroll:true});
}
async function load(f,h=null){
  const by=new Uint8Array(await f.arrayBuffer());let doc;
  try{doc=await pdfjsLib.getDocument({data:by.slice()}).promise}catch(e){return alert("Could not read that PDF: "+e.message)}
  const meta=await readNotes(by),nts=meta.notes,pal=meta.palette&&meta.palette.length?meta.palette:defPalette();
  nts.forEach(n=>{n.editing=false;if(!n.cid){const e=pal.find(x=>x.color.toLowerCase()===String(n.color||"").toLowerCase());if(e)n.cid=e.id}});
  const w1=(await doc.getPage(1)).getViewport({scale:1}).width;
  const b={id:++bid,pdf:doc,bytes:by,handle:h,fname:f.name,scale:autoScale(w1),notes:nts,palette:pal,cur:1,dirty:false,scroll:0,snap:snapOf(nts,pal)};
  books.push(b);await activate(b);
  toast(nts.length?`Loaded ${nts.length} note${nts.length>1?"s":""} from the PDF`:"No saved notes in this PDF yet");
}
function clearView(){
  closeNote();hidePeek();gen++;if(io)io.disconnect();
  pdf=null;bytes=null;handle=null;fname="";notes=[];cur=1;dims={};seen={};act=null;active=null;dirty=false;
  $("#pages").innerHTML="";$("#sel").style.display="none";$("#savepdf").classList.remove("dirty");
  $("#empty").style.display="";$("#closebk").style.display="none";
  $("#title").textContent="No book open";$("#total").textContent="";$("#pg").value=1;
  $("#toc").innerHTML='<p class="hint">Open a PDF to see its contents.</p>';$("#nl").innerHTML='<p class="hint">No notes yet.</p>';
  $("#viewer").scrollTop=0;renderTabs();
}
async function closeBook(b){
  stash();
  if(b.dirty&&!(await askSave([b])))return;
  books=books.filter(x=>x!==b);mru=mru.filter(x=>x!==b);try{b.pdf.destroy()}catch(e){}
  if(b===active){const nx=mru[0]||books[0];active=null;if(nx)await activate(nx,true);else clearView()}else renderTabs();
}
$("#closebk").onclick=()=>active&&closeBook(active);
function discard(b){
  {const sv=JSON.parse(b.snap);b.notes=sv.n;b.palette=sv.p}b.dirty=false;
  if(b===active){notes=b.notes;act=null;$("#note").style.display="none";setDirty(false);document.querySelectorAll(".page").forEach(drawHL);refreshList();renderSel()}
  renderTabs();
}
/* "save / discard" dialog: per-book choice, or save all / discard all. Resolves false if cancelled. */
function askSave(list){
  stash();
  return new Promise(res=>{
    const ov=mk("div");ov.id="dlg";const bx=mk("div","box"),one=list.length===1;
    bx.innerHTML=`<h3>Unsaved changes</h3><p>${one?"This book has":"These books have"} notes or highlights added since the last save.</p>`;
    const ch={};
    list.forEach(b=>{
      ch[b.id]="save";const row=mk("div","drow"),nm=mk("span","nm");nm.textContent=b.fname;row.append(nm);
      if(!one){const sg=mk("div","seg");
        ["save","discard"].forEach(k=>{const bt=mk("button",k==="save"?"on":"",k==="save"?"Save":"Discard");bt.onclick=()=>{ch[b.id]=k;sg.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===bt))};sg.append(bt)});
        row.append(sg)}
      bx.append(row)});
    const f=mk("div","dfoot");
    const run=async m=>{ov.remove();for(const b of list){if((m||ch[b.id])==="save"){if(!await saveBook(b)){res(false);return}}else discard(b)}res(true)};
    const btn=(t,c,fn)=>{const x=mk("button",c,t);x.onclick=fn;f.append(x)};
    btn("Cancel","",()=>{ov.remove();res(false)});
    if(!one)btn("Apply my choices","",()=>run(null));
    btn(one?"Discard":"Discard all","",()=>run("discard"));
    btn(one?"Save":"Save all","pri",()=>run("save"));
    bx.append(f);ov.append(bx);document.body.append(ov);
  });
}
/* N + Tab: switch books like Alt+Tab (most recently used first; keep Tab pressed for older ones) */
let nDown=false,cyc=false,ci=0;
addEventListener("keydown",e=>{
  if(e.key==="n"||e.key==="N"){nDown=true;return}
  if(e.key==="Tab"&&nDown&&books.length>1){
    e.preventDefault();e.stopPropagation();if(e.repeat)return;
    if(!cyc){cyc=true;ci=0}
    ci=(ci+(e.shiftKey?-1:1)+mru.length)%mru.length;activate(mru[ci],true);toast("Switched to "+mru[ci].fname);
  }
},true);
addEventListener("keyup",e=>{if(e.key==="n"||e.key==="N"){nDown=false;if(cyc){cyc=false;if(mru[ci])touch(mru[ci])}}},true);
addEventListener("blur",()=>{nDown=false;if(cyc){cyc=false;if(mru[ci])touch(mru[ci])}});


/* device detection: phone / tablet / laptop / tv, re-checked on resize and rotation */
const coarse=()=>matchMedia("(pointer:coarse)").matches;
const isTV=/SmartTV|SMART-TV|Tizen|Web0S|webOS|AppleTV|GoogleTV|Android TV|AFT[A-Z]|BRAVIA|HbbTV|CrKey|Roku|NetCast|VIDAA|Hisense|Vestel/i.test(navigator.userAgent);
function setDev(){
  const w=innerWidth,h=innerHeight;
  const d=isTV||w>=2560?"tv":(w<640||(coarse()&&h<500))?"phone":(w<1100||(coarse()&&w<1400))?"tablet":"laptop";
  document.documentElement.dataset.dev=d;return d;
}
setDev();
const closeSmall=()=>{if(matchMedia("(max-width:900px)").matches)$("#app").classList.remove("open")};
$("#app").classList.toggle("open",!matchMedia("(max-width:900px)").matches);
$("#scrim").onclick=()=>$("#app").classList.remove("open");
/* pick a page scale that suits the screen unless the reader has zoomed by hand */
function autoScale(w){
  const d=document.documentElement.dataset.dev,av=$("#viewer").clientWidth||innerWidth,pad=d==="phone"?12:d==="tablet"?36:60,fit=(av-pad)/w;
  return Math.max(.3,Math.min(4,d==="tv"?Math.min(2.4,fit):d==="laptop"?Math.min(1.3,fit):fit));
}
let rzT=0;
function onResize(){setDev();clearTimeout(rzT);rzT=setTimeout(()=>{
  if(!active||!pdf||active.uz||!dims[1])return;
  const ns=autoScale(dims[1][0]);if(Math.abs(ns/scale-1)>.04)zoom(ns/scale,true)},250)}
addEventListener("resize",onResize);addEventListener("orientationchange",onResize);
/* pinch to zoom (touch) and Ctrl+wheel / trackpad pinch (laptop) */
{const V=$("#viewer");V.style.touchAction="pan-x pan-y";
 let p0=0,pl=0;const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
 V.addEventListener("touchstart",e=>{if(e.touches.length===2)p0=pl=dist(e.touches)},{passive:true});
 V.addEventListener("touchmove",e=>{if(p0&&e.touches.length===2)pl=dist(e.touches)},{passive:true});
 V.addEventListener("touchend",e=>{if(p0&&e.touches.length<2){const f=pl/p0;p0=0;if(Math.abs(f-1)>.06)zoom(f)}},{passive:true});
 let wa=1,wt=0;V.addEventListener("wheel",e=>{if(!e.ctrlKey)return;e.preventDefault();wa*=e.deltaY<0?1.07:1/1.07;clearTimeout(wt);wt=setTimeout(()=>{zoom(wa);wa=1},110)},{passive:false});}
/* custom note resize grip (works with mouse, finger and pen) */
{const _rp=renderPop;renderPop=function(n){_rp(n);const pop=$("#note"),g=mk("div","rz");pop.append(g);
  g.onpointerdown=e=>{e.preventDefault();g.setPointerCapture(e.pointerId);const w0=pop.offsetWidth,h0=pop.offsetHeight,x0=e.clientX,y0=e.clientY;

  });
}

/* Save PDF: highlights + notes are written into the file */
async function saveBook(b){
  if(b===active){closeNote();stash()}
  try{
    const {PDFDocument,PDFName,PDFString,PDFHexString,PDFDict}=PDFLib;
    const doc=await PDFDocument.load(b.bytes,{ignoreEncryption:true}),ctx=doc.context;
    doc.getPages().forEach((pg,i)=>{
      const keep=[],old=pg.node.Annots();
      if(old)for(let k=0;k<old.size();k++){const d=old.lookupMaybe(k,PDFDict);if(!(d&&d.has(PDFName.of("MarginId"))))keep.push(old.get(k))}
      const {x:ox,y:oy,width:W,height:H}=pg.getMediaBox();
      b.notes.filter(n=>n.page===i+1).forEach(n=>{
        const quads=[];let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
        n.rects.forEach(r=>{
          const l=ox+r[0]*W,rt=ox+(r[0]+r[2])*W,t=oy+H-r[1]*H,b=oy+H-(r[1]+r[3])*H;
          quads.push(l,t,rt,t,l,b,rt,b);x0=Math.min(x0,l);x1=Math.max(x1,rt);y0=Math.min(y0,b);y1=Math.max(y1,t);
        });
        const rgb=[1,3,5].map(k=>parseInt(n.color.slice(k,k+2),16)/255),lbl=((b.palette.find(e=>e.id===n.cid)||{}).label||"");
        keep.push(ctx.register(ctx.obj({Type:"Annot",Subtype:"Highlight",Rect:[x0,y0,x1,y1],QuadPoints:quads,C:rgb,F:4,
          Contents:PDFHexString.fromText(plain(n.html)),T:PDFHexString.fromText(n.author||"Noman's PDF Reader"),MarginId:PDFString.of(n.id),...(lbl?{Subj:PDFHexString.fromText(lbl)}:{})})));
      });
      if(keep.length||old)pg.node.set(PDFName.of("Annots"),ctx.obj(keep));
    });
    const store=b.notes.map(({editing,...n})=>n);
    doc.catalog.set(PDFName.of("MarginNotes"),PDFString.of(btoa(unescape(encodeURIComponent(JSON.stringify({v:2,palette:b.palette,notes:store}))))));
    const out=await doc.save();
    if(b.handle){const w=await b.handle.createWritable();await w.write(out);await w.close();toast("Saved to "+b.fname)}
    else{const a=mk("a");a.href=URL.createObjectURL(new Blob([out],{type:"application/pdf"}));a.download=b.fname;a.click();toast("Downloaded "+b.fname+". Replace your original with it.")}
    b.bytes=out;b.snap=snapOf(b.notes,b.palette);b.dirty=false;
    if(b===active){bytes=out;setDirty(false)}else renderTabs();
    return true;
  }catch(e){console.error(e);alert("Could not save "+b.fname+": "+e.message);return false}
}
$("#savepdf").onclick=async()=>{
  if(!active)return alert("Open a PDF first.");
  const btn=$("#savepdf");btn.disabled=true;btn.textContent="Saving…";
  await saveBook(active);btn.disabled=false;btn.textContent="Save PDF";
};
